# The course environment. Start it with ./course, not with docker compose
# directly: the script picks the right profiles for each module.
#
# Services are grouped by profile so that a module starts only what it needs.
#   base   object storage and the toolbox (module 0 and every module after it)

name: course

services:
  storage:
    # S3-compatible object storage: the data lake lives here.
    # Why RustFS: docs/decisions/0001-object-storage.md
    image: rustfs/rustfs:1.0.4
    profiles: [base]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Create .env first - cp .env.example .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Create .env first - cp .env.example .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      # Bound to this machine only. 9000 is the S3 API, 9001 the web console.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || wget -qO /dev/null http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  toolbox:
    # Python environment for course scripts and module checkpoints, so that
    # nothing but Docker has to be installed on the learner's machine.
    build: ./docker/toolbox
    image: course-toolbox
    profiles: [base]
    command: ["sleep", "infinity"]
    init: true
    # Run as the learner's own user so files written to ./data belong to them.
    user: "${COURSE_UID:-1000}:${COURSE_GID:-1000}"
    environment:
      HOME: /tmp
      AWS_ENDPOINT_URL: http://storage:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Create .env first - cp .env.example .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Create .env first - cp .env.example .env}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    working_dir: /course
    volumes:
      - .:/course
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import boto3"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  storage-data:
