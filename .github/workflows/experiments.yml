name: Experiments

# Throwaway experiments behind the decision records in docs/decisions/.
# Runs on demand, and on pull requests that change an experiment.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - experiments/**
      - .github/workflows/experiments.yml

permissions:
  contents: read

jobs:
  object-storage:
    name: Object storage (${{ matrix.candidate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        candidate: [seaweedfs, garage, rustfs]
    steps:
      - uses: actions/checkout@v4

      - name: Run the experiment
        run: bash experiments/object-storage/run.sh ${{ matrix.candidate }}
