name: Checkpoints

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  toolbox:
    name: Toolbox image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the toolbox image
        run: docker build --tag course-toolbox docker/toolbox

      - name: Check the tools inside it
        run: |
          docker run --rm course-toolbox python --version
          docker run --rm course-toolbox uv --version
          docker run --rm course-toolbox pytest --version
          docker run --rm course-toolbox python -c "import boto3; print('boto3', boto3.__version__)"

  repository:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: .env cannot be committed
        run: |
          cp .env.example .env
          git check-ignore --quiet .env
          test -z "$(git status --porcelain)"

      - name: data/ contents cannot be committed
        run: |
          echo "not a dataset" > data/example.tsv.gz
          git check-ignore --quiet data/example.tsv.gz
          test -z "$(git status --porcelain)"

  environment:
    name: Base environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Lint the course command
        run: |
          shellcheck course
          # macOS ships bash 3.2: the script must at least parse there.
          docker run --rm -v "$PWD:/w:ro" bash:3.2 bash -n /w/course

      - name: A clear message when .env is missing
        run: |
          if ./course up 2> /tmp/err.txt; then
            echo "expected ./course up to fail without .env"; exit 1
          fi
          cat /tmp/err.txt
          grep -q "cp .env.example .env" /tmp/err.txt

      - name: Create .env
        run: cp .env.example .env

      - name: ./course doctor
        run: ./course doctor

      - name: ./course up
        run: ./course up

      - name: ./course status
        run: ./course status

      - name: The toolbox can use the object storage
        run: |
          docker compose --profile base exec -T toolbox python - <<'PY'
          import boto3

          s3 = boto3.client("s3")
          s3.create_bucket(Bucket="ci-smoke")
          s3.put_object(Bucket="ci-smoke", Key="hello.txt", Body=b"hello")
          assert s3.get_object(Bucket="ci-smoke", Key="hello.txt")["Body"].read() == b"hello"
          s3.delete_object(Bucket="ci-smoke", Key="hello.txt")
          s3.delete_bucket(Bucket="ci-smoke")
          print("object storage round trip ok, boto3", boto3.__version__)
          PY

      - name: ./course data downloads once, then nothing
        run: |
          ./course data --only title_ratings | tee /tmp/first.txt
          grep -qx "DOWNLOADED 1" /tmp/first.txt
          ./course data --only title_ratings | tee /tmp/second.txt
          grep -qx "DOWNLOADED 0" /tmp/second.txt
          test "$(stat -c %u data/imdb/title.ratings.tsv.gz)" = "$(id -u)"

      - name: Week number, for the dataset cache
        id: week
        run: echo "key=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      # IMDb refreshes its files daily. A weekly cache keeps runs short and
      # still exercises the download regularly.
      - name: Dataset cache
        uses: actions/cache@v4
        with:
          path: data/imdb
          key: imdb-${{ steps.week.outputs.key }}

      - name: ./course data, every declared dataset
        run: ./course data

      - name: Nothing to commit after all of that
        run: |
          git status --short
          test -z "$(git status --porcelain)"

      - name: ./course check 0
        run: |
          ./course check 0 | tee /tmp/check.txt
          test "${PIPESTATUS[0]}" -eq 0
          # One line per criterion, none failing.
          test "$(grep -c -E '^(pass|skip|FAIL)  [1-9]\. ' /tmp/check.txt)" -eq 9
          ! grep -q '^FAIL' /tmp/check.txt

      - name: The checkpoint fails when a criterion is broken
        run: |
          touch stray-file.txt
          if ./course check 0 > /tmp/broken.txt; then
            echo "expected the checkpoint to fail with an untracked file"; exit 1
          fi
          rm stray-file.txt
          grep -E '^FAIL  5\. ' /tmp/broken.txt

      - name: ./course down removes every container
        run: |
          ./course down
          test -z "$(docker ps --all --quiet --filter label=com.docker.compose.project=course)"

      - name: Service logs, if something failed
        if: failure()
        run: docker compose --profile base logs --tail 80 || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the whole history for credentials
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

